[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "iik-bot-helper"
version = "0.1.0"
description = "Telegram-справочник ИИК Самарского университета"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.26,<4",
  "aiosqlite>=0.22,<1",
  "python-dotenv>=1.2,<2",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "pytest-asyncio>=1.3,<2", "ruff>=0.14,<1"]

[project.scripts]
iik-bot = "iik_bot.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/iik_bot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# Сигнатуры абстрактных методов aiogram BaseSession.
"tests/test_handlers.py" = ["ASYNC109"]
